<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Gym Tracker</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14161a;--muted:#6b7280;--line:#e3e5ea;--accent:#2563eb;--accent-ink:#fff;--good:#16a34a;--warn-bg:#fff4e5;--warn:#9a5b00;--field:#f1f3f6;--danger:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#eef0f3;--muted:#9aa3af;--line:#2a2f38;--accent:#4f8cff;--accent-ink:#fff;--good:#34d399;--warn-bg:#2b2112;--warn:#f5b759;--field:#22262e;--danger:#f87171;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(24px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:720px;margin:0 auto}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--field);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;min-width:52px;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:0;background:var(--field);min-width:44px;min-height:44px;border-radius:12px;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
section.sec{margin:10px 0 18px}
.sechead{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:12px 4px;text-align:left;min-height:48px}
.sechead .chev{transition:transform .15s;color:var(--muted);font-size:14px;width:16px}
.sec.collapsed .chev{transform:rotate(-90deg)}
.sechead .title{font-size:19px;font-weight:700;flex:1}
.sechead .count{color:var(--muted);font-size:14px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 10px}
.colhead{display:grid;grid-template-columns:1.25fr .8fr .8fr 1.45fr;gap:6px;padding:0 10px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.namerow{display:flex;align-items:flex-start;gap:6px}
.namecol{flex:1;min-width:0}
.name{width:100%;border:1px solid transparent;background:transparent;font-weight:650;font-size:17px;padding:6px 6px;border-radius:8px;min-height:40px;text-overflow:ellipsis}
.name:focus{outline:none;border-color:var(--accent);background:var(--field)}
.peak{font-size:12.5px;color:var(--muted);padding:0 7px 6px}
.peak b{color:var(--text);font-weight:650}
.more{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:10px;font-size:22px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.25fr .8fr .8fr 1.45fr;gap:6px;align-items:stretch}
.num{width:100%;min-height:48px;border:1px solid var(--line);background:var(--field);border-radius:12px;text-align:center;font-size:18px;font-weight:600;padding:0 4px;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.lbl{display:none}
.target{min-height:48px;border:1px dashed var(--line);background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;position:relative}
.target .tw{font-weight:700;font-size:16px}
.target .ts{font-size:13px;color:var(--muted)}
.target .pen{position:absolute;top:3px;right:6px;font-size:11px;color:var(--muted)}
.card.touched{border-left:4px solid var(--accent)}
.card.hit .target{border-style:solid;border-color:var(--good)}
.card.hit .target .tw::before{content:"✓ ";color:var(--good)}
.tnote{font-size:12px;color:var(--muted);padding:6px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secfoot{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:20px 0}
dialog{border:0;border-radius:20px;padding:0;background:var(--card);color:var(--text);width:min(520px,calc(100vw - 20px));max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:85vh}
.dlg h2{margin:0;font-size:18px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.dlg .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dlg input[type=text],.dlg select,.dlg textarea{min-height:46px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:8px 10px;font-size:16px;color:var(--text)}
.dlg .actions{display:flex;gap:8px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;font-size:15px!important;color:var(--text)!important;min-height:44px}
.check input{width:22px;height:22px}
.hist{font-size:14px;border-top:1px solid var(--line)}
.hist div{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist .d{color:var(--muted);width:66px;flex:none}
.hist .w{font-weight:650;width:96px;flex:none}
.hist .n{color:var(--muted);font-size:12.5px;flex:1;min-width:0}
.hist .x{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .2s;z-index:50;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:14px;font-size:14px}
@media (max-width:360px){.num{font-size:16px}.target .tw{font-size:14px}}

.startcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0 16px;box-shadow:var(--shadow)}
.startcard h2{margin:0 0 4px;font-size:18px}.startcard p{margin:0 0 12px;color:var(--muted);font-size:14px}
.btn.big{min-height:58px;font-size:18px;width:100%}
.active{position:sticky;top:64px;z-index:4;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px;margin:6px 0 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.active .info{flex:1;min-width:0}.active .t1{font-weight:750;font-size:16px}.active .t2{font-size:13px;opacity:.9}
.active .btn{flex:none;min-height:44px;padding:0 14px;background:#fff;color:#14161a;border:0}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.setrow{display:grid;grid-template-columns:28px 1fr 14px 1fr 40px;gap:6px;align-items:center}
.setrow .sn{color:var(--muted);font-weight:700;text-align:center}
.setrow .x{font-size:15px;color:var(--muted);text-align:center}
.setrow .rm{border:0;background:transparent;min-height:44px;font-size:22px;color:var(--danger)}
.sethead{display:grid;grid-template-columns:28px 1fr 14px 1fr 40px;gap:6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:center}
.exact{display:flex;gap:8px;margin-top:8px}
.exact .btn{min-height:46px;font-size:15px}
.tline{font-size:13.5px;color:var(--muted);padding:2px 7px}.tline b{color:var(--text)}
.status{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:center}
.st-none{background:var(--field);color:var(--muted)}.st-dirty{background:var(--warn-bg);color:var(--warn)}
.st-saved{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.card.saved{border-left:4px solid var(--good)}.card.dirty{border-left:4px solid var(--warn)}
.browse .card{padding:10px 10px 8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>

<script>
(function(){
"use strict";
var KEY="ganeshGymTracker.v1", KG2LB=2.20462;
var SEED=JSON.parse(document.getElementById("seed").textContent);
var COMPOUND=/row|pulldown|press|glute drive|deadlift|rdl/i;
var state, storageOK=true, undoSnap=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var s=JSON.parse(raw); if(valid(s)) return s;}}catch(e){storageOK=false;}
  return clone(SEED);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
function valid(s){return s&&Array.isArray(s.sections)&&s.sections.every(function(x){return Array.isArray(x.exercises);});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function trim0(n){return (Math.round(n*100)/100).toString();}
function toDisp(kg){ if(kg==null||kg===""||isNaN(kg)) return ""; return state.unit==="lb"? trim0(Math.round(kg*KG2LB*2)/2) : trim0(kg); }
function fromDisp(v){ v=String(v).replace(",","."); if(v.trim()==="") return null; var n=parseFloat(v); if(isNaN(n)) return null; return state.unit==="lb"? Math.round(n/KG2LB*1000)/1000 : n; }
function intOrNull(v){var n=parseInt(v,10);return isNaN(n)?null:n;}
function U(){return state.unit;}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function shortDate(iso){var p=(iso||"").split("-");if(p.length<3)return iso||"";var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1];return (+p[2])+" "+m;}
function uid(){return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function findEx(id){for(var i=0;i<state.sections.length;i++){var s=state.sections[i];for(var j=0;j<s.exercises.length;j++) if(s.exercises[j].id===id) return {sec:s,ex:s.exercises[j],idx:j};}return null;}
function secById(id){return state.sections.filter(function(s){return s.id===id;})[0];}
function peak(ex){var p=null;(ex.history||[]).forEach(function(h){var w=[h.weight_kg];(h.sets_detail||[]).forEach(function(d){if(d.role!=="warmup")w.push(d.weight_kg);});w.forEach(function(x){if(typeof x==="number"&&(p==null||x>p))p=x;});});return p;}
function isHit(ex){var c=ex.current||{},t=ex.target||{};if(c.kg==null||c.sets==null||c.reps==null)return false;
  return (t.kg==null||c.kg>=t.kg-1e-6)&&(t.sets==null||c.sets>=t.sets)&&(t.reps==null||c.reps>=t.reps);}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},2200);}

/* ---------- Google Sheet sync ---------- */
var SKEY="ganeshGymTracker.sync", OKEY="ganeshGymTracker.outbox", syncBusy=false;
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function syncCfg(){return lsGet(SKEY,{url:"",token:"",enabled:false});}
function outbox(){return lsGet(OKEY,[]);}
function setOutbox(o){lsSet(OKEY,o);}
function dayType(sec){var n=sec.name||"";if(sec.id==="ab"||/apollo bay/i.test(n))return "Apollo Bay";if(/^upper/i.test(n))return "Upper";if(/^lower/i.test(n))return "Lower";return n||"Other";}
function enqueue(rows){var o=outbox();rows.forEach(function(r){r.v=Date.now()+Math.random();var k=o.findIndex(function(x){return x.id===r.id;});if(k>=0){if(o[k]._ev==="session_finished")r._ev=o[k]._ev;o[k]=r;}else o.push(r);});setOutbox(o);}
function appRows(){var out=[];state.sections.forEach(function(sec){sec.exercises.forEach(function(ex){(ex.history||[]).forEach(function(h){if(h.id&&/^app-/.test(h.id))out.push(rowFor(sec,ex,h));});});});return out;}
function postJSON(url,obj){return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj),redirect:"follow"})
  .then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw new Error("HTTP "+r.status+": not JSON (check the URL ends in /exec and access is 'Anyone')");}return j;});});}
function flush(opts){
  opts=opts||{};var cfg=syncCfg(),o=outbox();
  if(!cfg.enabled||!cfg.url){if(opts.manual)toast(cfg.url?"Sync is off":"Set up Google Sheet sync first");return Promise.resolve(false);}
  if(!o.length){if(opts.manual)toast("Nothing waiting to sync");return Promise.resolve(true);}
  if(syncBusy)return Promise.resolve(false);syncBusy=true;
  var batch=o.slice(0,200),fin=batch.some(function(r){return r._ev==="session_finished";}),f0=batch[0];
  var sessMeta={id:(f0.id.match(/^app-(\d{8}-[a-z0-9]+)-/)||[])[1]||"",date:f0.date,dayType:f0.dayType};
  return postJSON(cfg.url,{token:cfg.token,upsert:true,event:fin?"session_finished":(batch.some(function(r){return r._ev==="exercise_saved";})?"exercise_saved":"rows_logged"),session:sessMeta,rows:batch}).then(function(j){
    if(!j||!j.ok)throw new Error((j&&j.error)||"server said no");
    var sent={};batch.forEach(function(r){sent[r.id]=r.v;});setOutbox(outbox().filter(function(r){return !(r.id in sent)||sent[r.id]!==r.v;}));
    var w=(j.appended||0)+(j.updated||0);toast("Synced "+w+" to Google Sheet"+(j.skipped?" ("+j.skipped+" already there)":""));syncBusy=false;renderFoot();if(sess())render();
    if(outbox().length)return flush();return true;
  }).catch(function(err){syncBusy=false;renderFoot();toast("Sync failed, will retry"+(err&&err.message==="bad token"?" (wrong token)":""));console.warn("sync",err);return false;});
}
function migrateIds(){var n=0;state.sections.forEach(function(sec){sec.exercises.forEach(function(ex){(ex.history||[]).forEach(function(h){if(!h.id&&h.note==="logged in app"){h.id="app-"+h.date+"-"+Math.random().toString(36).slice(2,10);n++;}});});});if(n)save();}
function syncDlg(){
  var c=syncCfg();
  openDlg('<h2>Google Sheet sync</h2>'+
    '<label>Web App URL<input type="text" id="s-url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(c.url)+'"></label>'+
    '<label>Token<input type="text" id="s-token" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(c.token)+'"></label>'+
    '<label class="check"><input type="checkbox" id="s-on"'+(c.enabled?" checked":"")+'> Send each logged session to the sheet</label>'+
    '<div class="n" id="s-status" style="font-size:14px;color:var(--muted)">'+outbox().length+' waiting to send · stored on this device only</div>'+
    '<div class="actions"><button class="btn" data-d="test">Test connection</button><button class="btn" data-d="now">Sync now</button></div>'+
    '<button class="btn" data-d="all">Send all app-logged history</button>'+
    '<div class="actions"><button class="btn" data-d="cancel">Close</button><button class="btn primary" data-d="save">Save</button></div>',
  function(a){
    var st=document.getElementById("s-status");
    var cfg={url:val("s-url").trim(),token:val("s-token").trim(),enabled:document.getElementById("s-on").checked};
    lsSet(SKEY,cfg);
    if(a==="save"){closeDlg();renderFoot();toast(cfg.enabled?"Sheet sync on":"Sheet sync saved (off)");if(cfg.enabled)flush();}
    if(a==="test"){if(!cfg.url){st.textContent="Paste the Web App URL first";return;}st.textContent="Testing…";
      fetch(cfg.url,{redirect:"follow"}).then(function(r){return r.json();}).then(function(g){if(!g.ok)throw new Error("unexpected reply");
        return postJSON(cfg.url,{token:cfg.token,rows:[]}).then(function(p){st.textContent=p.ok?"✅ Connected. Log tab has "+g.rows+" rows, token OK.":"⚠️ Reached the sheet ("+g.rows+" rows) but the token was rejected: "+(p.error||"");});
      }).catch(function(e){st.textContent="❌ Couldn't connect: "+e.message;});}
    if(a==="now"){flush({manual:true}).then(function(){st.textContent=outbox().length+" waiting to send";});}
    if(a==="all"){var rows=appRows();if(!rows.length){st.textContent="No sessions logged in the app yet. Seed history is already in the sheet.";return;}
      enqueue(rows);st.textContent="Queued "+rows.length+" app-logged entries…";flush({manual:true}).then(function(){st.textContent=outbox().length+" waiting to send";});}
  });
}
function renderFoot(){var el=document.getElementById("syncfoot");if(!el)return;var c=syncCfg(),n=outbox().length;
  el.textContent=c.enabled&&c.url?("Google Sheet sync on"+(n?" · "+n+" waiting":" · up to date")):"";}

/* ---------- session model (v3) ----------
 state.session = {id,date,secId,dayType,started, entries:{exId:{sets:[{kg,reps}],dirty,savedAt,synced,prevTarget}}}
 Each exercise in a session -> ONE history entry + ONE sheet row, id "app-<sessionId>-<exId>" (stable, re-saves upsert). */
function sess(){return state.session||null;}
function entryFor(ex){var s=sess();if(!s)return null;var e=s.entries[ex.id];if(!e){var t=ex.target||{},c=ex.current||{};
  var kg=t.kg!=null?t.kg:c.kg,reps=t.reps||c.reps||8,n=t.sets||c.sets||3,arr=[];for(var i=0;i<n;i++)arr.push({kg:kg,reps:reps});
  e=s.entries[ex.id]={sets:arr,dirty:false,savedAt:null,synced:false,prevTarget:clone(ex.target||{})};}return e;}
function summarise(sets){var v=sets.filter(function(x){return x.kg!=null&&x.reps;});if(!v.length)return null;
  var top=Math.max.apply(null,v.map(function(x){return x.kg;}));var topSets=v.filter(function(x){return Math.abs(x.kg-top)<1e-6;});
  var topReps=Math.max.apply(null,topSets.map(function(x){return x.reps;}));
  return {top:top,count:v.length,topReps:topReps,topSets:topSets,valid:v,detail:v.map(function(x){return trim0(x.kg)+"x"+x.reps;}).join(", ")};}
function judge(ex,e){var sm=summarise(e.sets),t=e.prevTarget||{};if(!sm)return null;
  var inc=ex.compound?2.5:1.25,tk=t.kg!=null?t.kg:sm.top,ts=t.sets||sm.count,tr=t.reps||sm.topReps;
  // working sets = sets at or above the target weight; hit = enough of them reached target reps
  var good=sm.valid.filter(function(x){return x.kg>=tk-1e-6&&x.reps>=tr;}).length,hit=good>=ts,next;
  if(hit){var base=tk;sm.valid.forEach(function(x){var w=x.kg;if(w>base&&sm.valid.filter(function(y){return y.kg>=w-1e-6&&y.reps>=tr;}).length>=ts)base=w;});var nk=Math.round((base+inc)*1000)/1000;next={kg:nk,sets:ts,reps:tr,note:"auto: hit "+ts+"×"+tr+" @ "+trim0(base)+" kg → "+trim0(nk)+" kg"};}
  else next={kg:tk,sets:ts,reps:tr,note:"auto: repeat "+ts+"×"+tr+" @ "+trim0(tk)+" kg (got "+sm.detail+")"};
  return {sm:sm,hit:hit,next:next};}
function hid(ex){return "app-"+sess().id+"-"+ex.id;}
function rowFor(sec,ex,h){var nt=h.next_target_kg!=null?((ex.target&&ex.target.sets)||h.sets)+"×"+((ex.target&&ex.target.reps)||h.reps)+" @ "+trim0(h.next_target_kg):"";
  var det=(h.sets_detail&&h.sets_detail.length&&h.sets_detail[0].reps!=null&&h.sets_detail[0].sets==null)?h.sets_detail.map(function(x){return trim0(x.weight_kg)+"x"+x.reps;}).join(", "):h.sets+"×"+h.reps+" @ "+trim0(h.weight_kg);
  return {id:h.id,date:h.date,dayType:h.dayType||dayType(sec),exercise:ex.name,weightKg:h.weight_kg,sets:h.sets,reps:h.reps,setDetail:det,completed:!!h.completed,note:h.note||"",nextTarget:nt};}
function startSession(secId,date,dt){state.session={id:date.replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6),date:date,secId:secId,dayType:dt,started:Date.now(),entries:{}};
  secById(secId).collapsed=false;save();render();window.scrollTo(0,0);toast("Session started · "+dt+" · "+shortDate(date));}
function saveExercise(id,quiet){
  var f=findEx(id),ex=f.ex,e=entryFor(ex),s=sess(),j=judge(ex,e);if(!j){toast("Enter weight and reps for at least one set");return false;}
  ex.history=ex.history||[];var id_=hid(ex),i=ex.history.findIndex(function(h){return h.id===id_;});
  var h={id:id_,date:s.date,session:s.dayType,dayType:s.dayType,weight_kg:j.sm.top,sets:j.sm.count,reps:j.sm.topReps,completed:j.hit,note:"logged in app",
    sets_detail:j.sm.valid.map(function(x){return {weight_kg:x.kg,reps:x.reps,role:"work"};}),next_target_kg:j.next.kg,next_target_note:j.next.note};
  if(i>=0)ex.history[i]=h;else ex.history.push(h);
  ex.target=j.next;ex.current={kg:j.sm.top,sets:j.sm.count,reps:j.sm.topReps};e.dirty=false;e.savedAt=Date.now();e.synced=false;
  save();var cfg=syncCfg();if(cfg.enabled&&cfg.url){var r=rowFor(f.sec,ex,h);r._ev="exercise_saved";enqueue([r]);flush();}
  render();if(!quiet)toast("Saved "+ex.name+(j.hit?" · ✓ target hit":"")+(cfg.enabled&&cfg.url?" · syncing…":""));return true;}
function finishSession(){var s=sess();if(!s)return;
  var dirty=[],saved=[];Object.keys(s.entries).forEach(function(k){var f=findEx(k);if(!f)return;var e=s.entries[k];if(e.dirty)dirty.push(f.ex);else if(e.savedAt)saved.push(f);});
  if(dirty.length&&confirm(dirty.length+" exercise(s) have unsaved changes ("+dirty.map(function(x){return x.name;}).join(", ")+"). Save them before finishing?"))dirty.forEach(function(x){saveExercise(x.id,true);saved.push(findEx(x.id));});
  if(!confirm("Finish "+s.dayType+" session ("+shortDate(s.date)+")? "+saved.length+" exercise(s) saved."))return;
  var cfg=syncCfg();if(cfg.enabled&&cfg.url&&saved.length){enqueue(saved.map(function(f){var h=f.ex.history.filter(function(x){return x.id==="app-"+s.id+"-"+f.ex.id;})[0];var r=rowFor(f.sec,f.ex,h);r._ev="session_finished";return r;}));}
  state.lastSession={id:s.id,date:s.date,dayType:s.dayType,count:saved.length};delete state.session;save();render();toast("Session finished · "+saved.length+" exercises");if(cfg.enabled&&cfg.url)flush();}
function stStatus(ex){var e=sess()&&sess().entries[ex.id];if(!e||(!e.dirty&&!e.savedAt))return ["none","Not saved"];if(e.dirty)return ["dirty",e.savedAt?"Changed · not saved":"Not saved"];
  var c=syncCfg();if(!(c.enabled&&c.url))return ["saved","✓ Saved"];var pend=outbox().some(function(r){return r.id===hid(ex);});return ["saved",pend?"✓ Saved · syncing":"✓ Saved · in sheet"];}

/* ---------- render ---------- */
function render(){
  document.getElementById("u-kg").classList.toggle("on",U()==="kg");
  document.getElementById("u-lb").classList.toggle("on",U()==="lb");
  var h="",S=sess();
  if(!storageOK) h+='<div class="banner">Storage unavailable in this browser mode, so changes won\'t survive a reload. Use Export to save.</div>';
  if(S){var n=0,tot=0;var sec=secById(S.secId)||state.sections[0];sec.exercises.forEach(function(x){tot++;var e=S.entries[x.id];if(e&&e.savedAt&&!e.dirty)n++;});
    h+='<div class="active" id="activebar"><div class="info"><div class="t1">● '+esc(S.dayType)+' session</div><div class="t2">'+shortDate(S.date)+' · '+n+'/'+tot+' saved</div></div><button class="btn" data-act="finish">Finish session</button></div>';
    h+='<section class="sec" data-sec="'+esc(sec.id)+'">';
    if(sec.banner) h+='<div class="banner">⚠️ '+esc(sec.banner)+'</div>';
    sec.exercises.forEach(function(ex){h+=liveCard(ex);});
    h+='<div class="secfoot"><button class="btn" data-act="add" data-sec="'+esc(sec.id)+'">＋ Add exercise</button></div></section>';
    h+='<div class="secfoot" style="margin-top:14px"><button class="btn primary big" data-act="finish">Finish session</button></div>';
    h+='<div class="secfoot" style="margin-top:8px"><button class="btn danger" data-act="discard">Discard session</button></div>';
  } else {
    h+='<div class="startcard"><h2>Ready to train?</h2><p>'+(state.lastSession?'Last session: '+esc(state.lastSession.dayType)+' · '+shortDate(state.lastSession.date)+' ('+state.lastSession.count+' exercises)':'Start a session, then save each exercise as you go.')+'</p><button class="btn primary big" data-act="start">▶ Start new session</button></div>';
    state.sections.forEach(function(s){
      h+='<section class="sec browse'+(s.collapsed?" collapsed":"")+'" data-sec="'+esc(s.id)+'">';
      h+='<button class="sechead" data-act="toggle" data-sec="'+esc(s.id)+'"><span class="chev">▼</span><span class="title">'+esc(s.name)+'</span><span class="count">'+s.exercises.length+' exercises</span></button>';
      if(!s.collapsed){if(s.banner) h+='<div class="banner">⚠️ '+esc(s.banner)+'</div>';
        s.exercises.forEach(function(ex){h+=browseCard(ex);});if(!s.exercises.length)h+='<div class="empty">No exercises yet.</div>';
        h+='<div class="secfoot"><button class="btn" data-act="add" data-sec="'+esc(s.id)+'">＋ Add exercise</button></div>';}
      h+='</section>';});
  }
  h+='<div class="foot" id="syncfoot"></div><div class="foot">Saved on this device. ⋯ → Export to move data to another phone or computer.</div>';
  document.getElementById("app").innerHTML=h;renderFoot();
}
function peakLine(ex){var p=peak(ex),last=(ex.history||[]).slice(-1)[0];var pk=p!=null?'Peak <b>'+toDisp(p)+' '+U()+'</b>':'No history yet';
  if(last)pk+=' · last '+shortDate(last.date)+': '+last.sets+'×'+last.reps+' @ '+toDisp(last.weight_kg);return pk;}
function tgtText(t){return (t.sets!=null?t.sets:'?')+'×'+(t.reps!=null?t.reps:'?')+' @ '+(t.kg!=null?toDisp(t.kg)+' '+U():'—');}
function browseCard(ex){var t=ex.target||{};
  return '<div class="card" data-id="'+esc(ex.id)+'"><div class="namerow"><div class="namecol"><input class="name" data-f="name" value="'+esc(ex.name)+'" aria-label="Exercise name" enterkeyhint="done" autocomplete="off"><div class="peak">'+peakLine(ex)+'</div></div><button class="more" data-act="exmenu" aria-label="Exercise options">⋯</button></div>'+
  '<div class="brow"><button class="target" style="flex:1;flex-direction:row;gap:6px" data-act="target"><span class="ts">🎯 Next</span><span class="tw">'+esc(tgtText(t))+'</span><span class="pen">✎</span></button></div>'+
  (t.note?'<div class="tnote" title="'+esc(t.note)+'">'+esc(t.note)+'</div>':'')+'</div>';}
function liveCard(ex){var e=entryFor(ex),t=e.prevTarget||{},st=stStatus(ex);
  var rows=e.sets.map(function(x,i){return '<div class="setrow" data-i="'+i+'"><span class="sn">'+(i+1)+'</span>'+
    '<input class="num" data-f="skg" inputmode="decimal" type="text" aria-label="Set '+(i+1)+' weight '+U()+'" value="'+toDisp(x.kg)+'" placeholder="–">'+
    '<span class="x">×</span><input class="num" data-f="sreps" inputmode="numeric" type="text" aria-label="Set '+(i+1)+' reps" value="'+(x.reps==null?"":x.reps)+'" placeholder="–">'+
    '<button class="rm" data-act="rmset" aria-label="Remove set '+(i+1)+'">−</button></div>';}).join("");
  return '<div class="card '+(st[0]==="saved"?"saved":st[0]==="dirty"?"dirty":"")+'" data-id="'+esc(ex.id)+'">'+
    '<div class="namerow"><div class="namecol"><input class="name" data-f="name" value="'+esc(ex.name)+'" aria-label="Exercise name" enterkeyhint="done" autocomplete="off">'+
    '<div class="tline">🎯 Target <b>'+esc(tgtText(t))+'</b></div><div class="peak">'+peakLine(ex)+'</div></div>'+
    '<span class="status st-'+st[0]+'">'+st[1]+'</span><button class="more" data-act="exmenu" aria-label="Exercise options">⋯</button></div>'+
    '<div class="sethead"><span>Set</span><span>Weight ('+U()+')</span><span></span><span>Reps</span><span></span></div><div class="sets">'+rows+'</div>'+
    '<div class="exact"><button class="btn" data-act="addset">＋ Add set</button><button class="btn primary" data-act="saveex">'+(e.savedAt&&!e.dirty?'✓ Saved':'Save exercise')+'</button></div></div>';}

/* ---------- dialogs ---------- */
var dlg=document.getElementById("dlg"), body=document.getElementById("dlgBody"), onDlg=null;
function openDlg(html,handler){body.innerHTML=html;onDlg=handler;if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");}
function closeDlg(){if(dlg.close)dlg.close();else dlg.removeAttribute("open");onDlg=null;}
body.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;e.preventDefault();var a=b.getAttribute("data-d");if(a==="cancel"){closeDlg();return;}if(onDlg)onDlg(a,b);});
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDlg();});

function targetDlg(id){
  var f=findEx(id),ex=f.ex,t=ex.target||{};
  openDlg('<h2>Target · '+esc(ex.name)+'</h2>'+
    '<div class="row3"><label>Weight ('+U()+')<input type="text" class="num" inputmode="decimal" id="t-kg" value="'+toDisp(t.kg)+'"></label>'+
    '<label>Sets<input type="text" class="num" inputmode="numeric" id="t-sets" value="'+(t.sets==null?"":t.sets)+'"></label>'+
    '<label>Reps<input type="text" class="num" inputmode="numeric" id="t-reps" value="'+(t.reps==null?"":t.reps)+'"></label></div>'+
    '<label>Note<input type="text" id="t-note" value="'+esc(t.note||"")+'"></label>'+
    '<div class="actions"><button class="btn" data-d="copy">Reset session sets to target</button></div>'+
    '<div class="actions"><button class="btn" data-d="cancel">Cancel</button><button class="btn primary" data-d="save">Save</button></div>',
  function(a){
    if(a==="save"){var se=sess()&&sess().entries[ex.id];ex.target={kg:fromDisp(val("t-kg")),sets:intOrNull(val("t-sets")),reps:intOrNull(val("t-reps")),note:val("t-note").trim()};if(se&&!se.savedAt)se.prevTarget=clone(ex.target);save();closeDlg();render();toast("Target saved");}
    if(a==="copy"){if(!sess()){toast("Start a session first");return;}delete sess().entries[ex.id];save();closeDlg();render();toast("Sets reset to target");}
  });
}
function val(id){return document.getElementById(id).value;}

function exMenu(id){
  var f=findEx(id),ex=f.ex;
  var opts=state.sections.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===f.sec.id?" selected":"")+'>'+esc(s.name)+'</option>';}).join("");
  var hist=(ex.history||[]).slice().reverse().map(function(h,i){var ri=ex.history.length-1-i;return '<div><span class="d">'+shortDate(h.date)+'</span><span class="w">'+h.sets+'×'+h.reps+' @ '+toDisp(h.weight_kg)+'</span><span class="n">'+(h.completed===false?'✗ ':'✓ ')+esc(h.note||h.session||"")+'</span><button class="more x" data-d="delh" data-i="'+ri+'" aria-label="Delete entry">×</button></div>';}).join("");
  openDlg('<h2>'+esc(ex.name)+'</h2>'+
    '<label>Section<select id="m-sec">'+opts+'</select></label>'+
    '<label class="check"><input type="checkbox" id="m-comp"'+(ex.compound?" checked":"")+'> Compound lift (+2.5 kg progression; off = +1.25 kg)</label>'+
    '<label>Notes<input type="text" id="m-notes" value="'+esc(ex.notes||"")+'"></label>'+
    '<div class="actions"><button class="btn" data-d="up">↑ Move up</button><button class="btn" data-d="down">↓ Move down</button></div>'+
    '<div class="actions"><button class="btn danger" data-d="del">Delete exercise</button><button class="btn primary" data-d="save">Done</button></div>'+
    '<h2 style="font-size:15px">History ('+(ex.history||[]).length+')</h2><div class="hist">'+(hist||'<div class="n" style="padding:8px 0">No sessions logged yet.</div>')+'</div>',
  function(a,b){
    var cur=findEx(id);
    if(a==="save"){ex.compound=document.getElementById("m-comp").checked;ex.notes=val("m-notes");var to=val("m-sec");if(to!==cur.sec.id){cur.sec.exercises.splice(cur.idx,1);secById(to).exercises.push(ex);toast("Moved to "+secById(to).name);}save();closeDlg();render();}
    if(a==="up"||a==="down"){var arr=cur.sec.exercises,j=cur.idx+(a==="up"?-1:1);if(j<0||j>=arr.length)return;arr.splice(cur.idx,1);arr.splice(j,0,ex);save();render();toast("Moved "+a);}
    if(a==="del"){if(confirm("Delete \""+ex.name+"\" and its history?")){snapshot();cur.sec.exercises.splice(cur.idx,1);save();closeDlg();render();toast("Deleted. ⋯ menu → Undo to restore");}}
    if(a==="delh"){var i=+b.getAttribute("data-i");if(confirm("Delete the "+shortDate(ex.history[i].date)+" entry?")){snapshot();ex.history.splice(i,1);save();render();exMenu(id);}}
  });
}
function addDlg(secId){
  openDlg('<h2>Add exercise</h2><label>Name<input type="text" id="a-name" placeholder="e.g. Incline press"></label>'+
    '<div class="row3"><label>Weight ('+U()+')<input type="text" class="num" inputmode="decimal" id="a-kg"></label><label>Sets<input type="text" class="num" inputmode="numeric" id="a-sets" value="3"></label><label>Reps<input type="text" class="num" inputmode="numeric" id="a-reps" value="8"></label></div>'+
    '<div class="actions"><button class="btn" data-d="cancel">Cancel</button><button class="btn primary" data-d="add">Add</button></div>',
  function(a){if(a!=="add")return;var n=val("a-name").trim();if(!n){document.getElementById("a-name").focus();return;}
    var kg=fromDisp(val("a-kg")),s=intOrNull(val("a-sets")),r=intOrNull(val("a-reps"));
    secById(secId).exercises.push({id:uid(),name:n,notes:"",compound:COMPOUND.test(n),current:{kg:kg,sets:s,reps:r},target:{kg:kg,sets:s,reps:r,note:""},history:[]});
    save();closeDlg();render();toast("Added "+n);});
  setTimeout(function(){var i=document.getElementById("a-name");i&&i.focus();},50);
}
function menuDlg(){
  openDlg('<h2>Data</h2>'+
    '<button class="btn" data-d="sync">🔄 Google Sheet sync</button>'+
    '<button class="btn" data-d="export">⬇︎ Export JSON</button>'+
    '<button class="btn" data-d="import">⬆︎ Import JSON</button>'+
    '<button class="btn" data-d="undo"'+(undoSnap?'':' disabled')+'>↶ Undo last log / delete</button>'+
    '<button class="btn danger" data-d="reset">Reset to original seed data</button>'+
    '<button class="btn" data-d="cancel">Close</button>',
  function(a){
    if(a==="sync"){syncDlg();}
    if(a==="export"){exportJSON();closeDlg();}
    if(a==="import"){closeDlg();document.getElementById("importFile").click();}
    if(a==="undo"&&undoSnap){state=undoSnap;undoSnap=null;save();var keep={};appRows().forEach(function(r){keep[r.id]=1;});setOutbox(outbox().filter(function(r){return keep[r.id];}));closeDlg();render();toast("Undone (rows already sent to the sheet stay there)");}
    if(a==="reset"&&confirm("Replace everything on this device with the original seed data? Export first if unsure.")){snapshot();state=clone(SEED);save();closeDlg();render();toast("Reset to seed");}
  });
}

/* ---------- logging ---------- */
function snapshot(){undoSnap=clone(state);}
function startDlg(){
  var opts=state.sections.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>';}).join("");
  openDlg('<h2>Start new session</h2><label>Workout<select id="n-sec">'+opts+'</select></label><label>Date<input type="date" id="n-date" value="'+today()+'" style="min-height:46px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:8px 10px;font-size:16px"></label>'+
    '<div class="actions"><button class="btn" data-d="cancel">Cancel</button><button class="btn primary" data-d="go">Start</button></div>',
  function(a){if(a!=="go")return;var sid=val("n-sec"),d=val("n-date")||today();closeDlg();startSession(sid,d,dayType(secById(sid)));});}
/* ---------- import/export ---------- */
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"}),name="gym-tracker-"+today()+".json";
  var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);toast("Exported "+name);
}
document.getElementById("importFile").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var s=JSON.parse(r.result);if(!valid(s))throw new Error("not a gym tracker file");
    if(!confirm("Replace data on this device with "+f.name+"?"))return;snapshot();state=s;state.unit=state.unit||"kg";save();render();toast("Imported "+f.name);}
    catch(err){alert("Import failed: "+err.message);}finally{e.target.value="";}};
  r.readAsText(f);
});

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||body.contains(b))return;
  var a=b.getAttribute("data-act"),cardEl=b.closest(".card"),id=cardEl&&cardEl.getAttribute("data-id");
  if(a==="unit"){state.unit=b.getAttribute("data-u");save();render();}
  else if(a==="toggle"){var s=secById(b.getAttribute("data-sec"));s.collapsed=!s.collapsed;save();render();}
  else if(a==="target")targetDlg(id);
  else if(a==="exmenu")exMenu(id);
  else if(a==="add")addDlg(b.getAttribute("data-sec"));
  else if(a==="start")startDlg();
  else if(a==="finish")finishSession();
  else if(a==="discard"){if(confirm("Discard this session? Exercises you already saved stay in history and the sheet."))
    {delete state.session;save();render();}}
  else if(a==="saveex")saveExercise(id);
  else if(a==="addset"){var e=entryFor(findEx(id).ex),l=e.sets[e.sets.length-1]||{};e.sets.push({kg:l.kg,reps:l.reps});e.dirty=true;save();render();}
  else if(a==="rmset"){var e2=entryFor(findEx(id).ex);if(e2.sets.length<=1){toast("Keep at least one set");return;}e2.sets.splice(+b.closest(".setrow").getAttribute("data-i"),1);e2.dirty=true;save();render();}
  else if(a==="menu")menuDlg();
});
document.getElementById("app").addEventListener("input",function(e){
  var el=e.target,f=el.getAttribute("data-f");if(!f)return;var cardEl=el.closest(".card"),ex=findEx(cardEl.getAttribute("data-id")).ex;
  if(f==="name"){var n=el.value.trim();if(n)ex.name=n;save();return;}
  var e=entryFor(ex),i=+el.closest(".setrow").getAttribute("data-i");
  if(f==="skg")e.sets[i].kg=fromDisp(el.value);else e.sets[i].reps=intOrNull(el.value);
  e.dirty=true;cardEl.classList.remove("saved");cardEl.classList.add("dirty");var st=cardEl.querySelector(".status");if(st){st.className="status st-dirty";st.textContent=e.savedAt?"Changed · not saved":"Not saved";}
  var sb=cardEl.querySelector("[data-act=saveex]");if(sb)sb.textContent="Save exercise";save();
});
document.getElementById("app").addEventListener("change",function(e){if(e.target.getAttribute("data-f")==="name"&&!e.target.value.trim())render();});
document.getElementById("app").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.matches("input"))e.target.blur();});
document.getElementById("app").addEventListener("focusin",function(e){if(e.target.classList.contains("num"))setTimeout(function(){try{e.target.select();}catch(_){}} ,0);});

state=load();state.unit=state.unit||"kg";migrateIds();render();
setTimeout(flush,1500);window.addEventListener("online",function(){flush();});
window.__gym={get state(){return state;},flush:flush,outbox:outbox,judge:judge,summarise:summarise};
})();
</script>
</body>
